site_name: Untitled Notebook
site_url: https://untitlednotebook.github.io
theme:
  name: material
  features:
      - content.action.edit
      - content.action.view
      - content.code.annotate
      - content.code.copy
      # - content.code.select
      # - content.footnote.tooltips
      # - content.tabs.link
      - content.tooltips
      # - header.autohide
      # - navigation.expand
      # - navigation.footer
      - navigation.indexes
      # - navigation.instant
      # - navigation.instant.prefetch
      # - navigation.instant.progress
      # - navigation.prune
      # - navigation.sections
      - navigation.tabs
      # - navigation.tabs.sticky
      - navigation.top
      - navigation.tracking
      - search.highlight
      - search.share
      - search.suggest
      - toc.follow
      # - toc.integrate
plugins:
  - search
  - blog

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@4.1.3/tex-mml-chtml.js

nav:
  - Home: index.md
  - Blog: blog/index.md
  - Notes:
      - notes/index.md
      - NLP:
          - notes/nlp/index.md
          - Part 1:
              - notes/nlp/part-1/index.md
              - Context-free grammars: notes/nlp/part-1/context-free-grammars.md
